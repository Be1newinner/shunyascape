name: Deploy Backend to Oracle VPS

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'          # only run when backend code changes
      - '.github/workflows/**'
  workflow_dispatch:          # manual trigger from GitHub UI

# Cancel any in-progress deploy on a new push
concurrency:
  group: deploy-backend-production
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Type-check & build on the GitHub runner (fast fail before VPS)
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: 🔨 Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Build (esbuild → dist/index.js)
        working-directory: backend
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — SSH into Oracle VPS and deploy
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Oracle VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy backend on VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "${{ secrets.VPS_PORT }}" \
              -o StrictHostKeyChecking=no \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'ENDSSH'

            set -e
            cd "${{ secrets.VPS_PROJECT_DIR }}"

            echo "⬇️  Pulling latest code..."
            git pull origin main

            echo "📦 Installing backend dependencies..."
            cd "${{ secrets.VPS_PROJECT_DIR }}/backend"
            npm ci --omit=dev

            echo "🔨 Building backend..."
            npm run build

            echo "♻️  Restarting PM2 service..."
            cd "${{ secrets.VPS_PROJECT_DIR }}"
            pm2 restart ecosystem.config.cjs --env production --update-env \
              || pm2 start ecosystem.config.cjs --env production

            pm2 save

            echo "✅ Backend deployed successfully!"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
