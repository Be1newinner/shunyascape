name: Deploy Backend to Oracle VPS

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'          # only run when backend code changes
      - '.github/workflows/**'
  workflow_dispatch:          # manual trigger from GitHub UI

# Cancel any in-progress deploy on a new push
concurrency:
  group: deploy-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Build and Deploy to Oracle VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Type-check
        working-directory: backend
        run: npm run check || npx tsc --noEmit

      - name: Build (esbuild → dist/index.js)
        working-directory: backend
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Package and transfer files to VPS
        run: |
          # Package the built backend and config
          tar -czf deploy.tar.gz backend/package.json backend/dist ecosystem.config.cjs
          
          # Create project directory on VPS if not exists
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT }}" -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p ${{ secrets.VPS_PROJECT_DIR }}"
          
          # Transfer the archive
          scp -i ~/.ssh/deploy_key -P "${{ secrets.VPS_PORT }}" -o StrictHostKeyChecking=no deploy.tar.gz "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_DIR }}/"

      - name: Extract and Deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "${{ secrets.VPS_PORT }}" \
              -o StrictHostKeyChecking=no \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'ENDSSH'

            set -e
            
            # Load Node/NVM/PM2 environment variables
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            . ~/.profile || true
            . ~/.bashrc || true

            cd "${{ secrets.VPS_PROJECT_DIR }}"

            echo "📦 Extracting package..."
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            echo "📦 Installing backend dependencies..."
            cd backend
            npm install --omit=dev

            echo "♻️  Restarting PM2 service..."
            cd "${{ secrets.VPS_PROJECT_DIR }}"
            pm2 restart ecosystem.config.cjs --env production --update-env \
              || pm2 start ecosystem.config.cjs --env production

            pm2 save

            echo "✅ Backend deployed successfully!"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
